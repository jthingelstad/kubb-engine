name: validate

# The engine's check: the core's, the session's and the room's Lua tests on Lua 5.4, the
# notation gate and its refusal cases, the session under wasmoon, the golden
# hashes and the engine.json check (`make test`), then the headless games
# (`make games`). The job's name is the check a main ruleset would
# require: rename them together.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running check; main's runs finish.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions; the job asks for its own. Actions are pinned
# to commit SHAs and checkout leaves no token behind.
permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: npm ci (wasmoon)
        run: npm ci --no-audit --no-fund
      - name: Lua tests
        run: make test-lua LUA=lua5.4
      - name: Session tests
        run: make test-session LUA=lua5.4
      - name: Room tests
        run: make test-room LUA=lua5.4
      - name: Notation gate
        run: make test-node NODE=node
      - name: Session under wasmoon
        run: make test-wasm NODE=node
      - name: Golden hashes
        run: make golden-check NODE=node
      - name: engine.json
        run: make manifest-check NODE=node
      - name: Headless games
        run: make games LUA=lua5.4 NODE=node

  # The Kubb Gym's quick scorecard (docs/notes/gym.md): a measurement, not a check of
  # rates. It fails only when the tool fails or a throw shows a hard defect (a body
  # still moving at the time limit, or a state that is not a number); the scorecard's
  # JSON is kept as an artifact. No real games and no recorded matches here.
  gym:
    name: gym
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: quick scorecard
        run: node tools/gym.mjs --quick --gate --real none --json build/gym-quick.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gym-quick
          path: build/gym-quick.json
          if-no-files-found: warn
